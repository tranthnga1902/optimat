<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptiMat AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Giao diện chung theo mockup (61gv8j4o): thanh điều hướng tối bên trái, nội dung là các thẻ trắng trên nền xám xanh.
   Mọi số trên trang lấy từ API; trang không tự tính khối lượng, giá hay phương án. */
:root {
  --bg: #F4F6F5; --card: #FFFFFF; --ink: #16211D; --muted: #4C5A55; --rule: #D5DDD9; --rule2: #E6EBE8; --field: #B9C5C0;
  --accent: #0F6B5C; --accent-ink: #FFFFFF; --accent-soft: #D7EDE6; --accent-deep: #0A4A40;
  --nav-user: #10261F; --nav-admin: #16211D; --nav-on-user: #1F4A3E; --nav-on-admin: #33423C; --nav-muted: #C9D8D2;
  --mint: #7FD6BF; --amber: #F3B562;
  --warn-bg: #FCEBD0; --warn-ink: #7A4206; --bad-bg: #F9DCD8; --bad-ink: #8A1F14; --info-bg: #E3E8F5; --info-ink: #22366B;
  --f: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --card: #18201D; --ink: #E3EBE7; --muted: #9DB0A9; --rule: #2C3833; --rule2: #24302B; --field: #3C4A44;
    --accent: #3FB39B; --accent-ink: #0C1714; --accent-soft: #1D3B33; --accent-deep: #7FD6BF;
    --warn-bg: #3A2A12; --warn-ink: #F3C77E; --bad-bg: #3D1C18; --bad-ink: #F4A398; --info-bg: #1E2638; --info-ink: #AFC0EA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --card: #18201D; --ink: #E3EBE7; --muted: #9DB0A9; --rule: #2C3833; --rule2: #24302B; --field: #3C4A44;
  --accent: #3FB39B; --accent-ink: #0C1714; --accent-soft: #1D3B33; --accent-deep: #7FD6BF;
  --warn-bg: #3A2A12; --warn-ink: #F3C77E; --bad-bg: #3D1C18; --bad-ink: #F4A398; --info-bg: #1E2638; --info-ink: #AFC0EA;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.shell { display: flex; min-height: 100vh; }
nav.side { flex: 0 0 236px; color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
nav.side.user { background: var(--nav-user); } nav.side.admin { background: var(--nav-admin); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 18px; font-weight: 700; }
.menu { display: flex; flex-direction: column; gap: 4px; }
.menu a { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--nav-muted); text-decoration: none; }
.menu a[aria-current="page"] { color: #fff; font-weight: 600; }
nav.user .menu a[aria-current="page"] { background: var(--nav-on-user); } nav.admin .menu a[aria-current="page"] { background: var(--nav-on-admin); }
.menu .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 0 8px; font-size: 12.5px; color: var(--nav-muted); }
.side-foot a { min-height: 40px; display: flex; align-items: center; }
nav.user .side-foot a { color: var(--mint); } nav.admin .side-foot a { color: var(--amber); }
main { flex: 1 1 auto; min-width: 0; padding: 26px 30px 40px; display: flex; flex-direction: column; gap: 18px; }
main.full { padding: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-size: 23px; } .head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.steps a { display: inline-flex; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--muted); text-decoration: none; font-weight: 500; }
.steps a.done { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; font-weight: 600; }
.steps a[aria-current="step"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.row > .card { flex: 1 1 320px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.tile { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 13px; } .tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 12.5px; }
.tile.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn-ink); } .tile.warn .k, .tile.warn .s { color: inherit; }
.tile.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad-ink); } .tile.bad .k, .tile.bad .s { color: inherit; }
.tile.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent-deep); } .tile.ok .k, .tile.ok .s { color: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--card); font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
label.f input, label.f select, .filters select, .filters input { height: 44px; border: 1px solid var(--field); border-radius: 8px; padding: 0 12px; background: var(--card); font-weight: 400; }
.check { display: flex; align-items: center; gap: 8px; min-height: 32px; font-weight: 400; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--rule2); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 700; border-bottom: 0; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent-deep); } .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.bad { background: var(--bad-bg); color: var(--bad-ink); } .pill.info { background: var(--info-bg); color: var(--info-ink); }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--field); border-radius: 10px; }
.note { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); }
ul.notes { margin: 0; padding-left: 18px; color: var(--muted); }
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }
.msg { max-width: 90%; padding: 10px 12px; line-height: 1.5; white-space: pre-line; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-radius: 12px 12px 2px 12px; }
.msg.bot { align-self: flex-start; background: var(--bg); border-radius: 12px 12px 12px 2px; }
.chat-in { display: flex; gap: 8px; } .chat-in input { flex: 1 1 auto; min-width: 0; height: 44px; border: 1px solid var(--field); border-radius: 8px; padding: 0 12px; background: var(--card); }
iframe.review { border: 0; width: 100%; height: calc(100vh - 118px); min-height: 560px; display: block; background: var(--card); }
.review-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 20px; border-bottom: 1px solid var(--rule); background: var(--card); }
.review-bar .steps { margin-right: auto; }
.login { min-height: 100vh; display: flex; flex-wrap: wrap; }
.login .left { flex: 1 1 420px; background: var(--nav-user); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.login .left h1 { margin: 0; font-size: 38px; line-height: 1.2; } .login .left p { color: var(--nav-muted); max-width: 460px; font-size: 16.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; } .chips span { border: 1px solid #3C5A50; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--nav-muted); }
.login .right { flex: 1 1 460px; padding: 56px; display: flex; flex-direction: column; justify-content: center; }
.roles { max-width: 460px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.role { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 10px; text-decoration: none; border: 1px solid var(--field); background: var(--card); color: var(--ink); }
.role.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.role b { display: block; font-size: 16px; } .role span span { font-size: 13px; opacity: .85; }
@media (max-width: 860px) {
  .shell { flex-direction: column; } nav.side { position: static; height: auto; flex: none; padding: 14px; gap: 10px; }
  .menu { flex-direction: row; flex-wrap: wrap; } .side-foot { flex-direction: row; flex-wrap: wrap; gap: 12px; margin-top: 0; }
  main { padding: 18px 16px 32px; } .login .left, .login .right { padding: 28px 16px; } iframe.review { height: 80vh; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// ------------------------------------------------------------------ tiện ích
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, d = 2) => v == null || isNaN(v) ? "" : Number(v).toLocaleString("vi-VN", { maximumFractionDigits: d, minimumFractionDigits: d });
const money = (v) => v == null || isNaN(v) ? "" : Math.round(v).toLocaleString("vi-VN");
const ROLE = { envelope: "bao che", partition: "ngăn" };
const FAMILIES = [["CLAY_SOLID", "Gạch đất nung đặc"], ["CLAY_HOLLOW", "Gạch đất nung rỗng"], ["CMU_SOLID", "Gạch bê tông đặc"],
  ["CMU_HOLLOW", "Gạch block rỗng"], ["CLC", "Bê tông bọt (CLC)"], ["AAC", "Bê tông khí (AAC)"], ["ALC_PANEL", "Tấm ALC"],
  ["EPS_PANEL", "Panel EPS"], ["CEMBOARD", "Cemboard"], ["GYPSUM", "Thạch cao"]];
const store = {                         // lưu trên trình duyệt (tiện cho một người dùng); kết quả chốt chính thức nằm trong database
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail))) || `Lỗi ${r.status}`);
  return body;
}
const post = (path, data) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
const pill = (level, text) => `<span class="pill ${level}">${esc(text)}</span>`;
const logo = (c) => `<svg width="28" height="28" viewBox="0 0 36 36" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="20" width="12" height="12"></rect><rect x="20" y="20" width="12" height="12"></rect><rect x="12" y="6" width="12" height="12"></rect></svg>`;

// ------------------------------------------------------------------ kết quả đã xác nhận trên trang Kiểm tra bóc tách
// Trang kiểm tra (trong khung) ghi từng mặt bằng đã chốt vào "optimat-confirmed"; ở đây gộp các tầng theo
// loại tường + vai trò + phương án tường để đưa sang tra giá và tối ưu.
const confirmedPlans = () => store.get("optimat-confirmed", []);
function mergedGroups() {
  const by = {};
  for (const p of confirmedPlans()) for (const g of p.groups || []) {
    const k = [g.wall_type, g.role, g.design_wall_system_id || g.design_material_id || ""].join("|");
    const t = (by[k] = by[k] || { ...g, length_m: 0, gross_area_m2: 0, opening_area_m2: 0, net_area_m2: 0 });
    for (const f of ["length_m", "gross_area_m2", "opening_area_m2", "net_area_m2"]) t[f] = Math.round((t[f] + g[f]) * 100) / 100;
  }
  return Object.values(by).sort((a, b) => (a.wall_type + a.role).localeCompare(b.wall_type + b.role));
}
window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.type === "optimat-confirmed") renderNav(); });

// ------------------------------------------------------------------ điều hướng
const ROUTES = {
  "dang-nhap": { role: null }, "do-boc": { role: "user", title: "Hồ sơ và đo bóc" }, "vat-lieu": { role: "user", title: "Vật liệu và giá" },
  "toi-uu": { role: "user", title: "Phương án tối ưu" }, "kiem-soat": { role: "admin", title: "Kiểm soát dữ liệu" },
  "danh-muc": { role: "admin", title: "Vật liệu và phương án tường" }, "gia": { role: "admin", title: "Giá và nhà cung cấp" },
  "mo-hinh": { role: "admin", title: "Mô hình và cấu hình" },
};
const route = () => { const r = location.hash.replace(/^#/, ""); return ROUTES[r] ? r : (store.get("optimat-role", null) === "admin" ? "kiem-soat" : store.get("optimat-role", null) ? "do-boc" : "dang-nhap"); };
window.addEventListener("hashchange", render);

function renderNav() {
  const r = route(), role = ROUTES[r].role, nav = $("nav");
  if (!nav) return;
  const n = confirmedPlans().length;
  const items = role === "admin"
    ? [["kiem-soat", "Kiểm soát dữ liệu"], ["danh-muc", "Vật liệu, phương án tường"], ["gia", "Giá, nhà cung cấp"], ["mo-hinh", "Mô hình, cấu hình"]]
    : [["do-boc", "Hồ sơ và đo bóc"], ["vat-lieu", "Vật liệu và giá", n ? `${n} mặt bằng` : ""], ["toi-uu", "Phương án tối ưu"]];
  nav.className = "side " + role;
  nav.innerHTML = `<div class="brand">${logo(role === "admin" ? "#F3B562" : "#7FD6BF")} OptiMat AI</div>
    <div class="menu">${items.map(([k, t, b]) => `<a href="#${k}" ${k === r ? 'aria-current="page"' : ""}>${esc(t)}${b ? `<span class="badge">${esc(b)}</span>` : ""}</a>`).join("")}</div>
    <div class="side-foot"><span>Vai trò: ${role === "admin" ? "Quản trị viên" : "Người dùng"}</span>
      <a href="#${role === "admin" ? "do-boc" : "kiem-soat"}" data-role="${role === "admin" ? "user" : "admin"}">${role === "admin" ? "Xem giao diện người dùng" : "Sang trang quản trị"}</a>
      <a href="#dang-nhap">Đổi vai trò</a><a href="/docs" target="_blank" rel="noopener">Tài liệu API</a></div>`;
  nav.querySelectorAll("[data-role]").forEach((a) => a.addEventListener("click", () => store.set("optimat-role", a.dataset.role)));
}

function render() {
  const r = route(), def = ROUTES[r], root = $("root");
  document.title = (def.title ? def.title + " · " : "") + "OptiMat AI";
  if (!def.role) { root.innerHTML = loginView(); return; }
  store.set("optimat-role", def.role);
  root.innerHTML = `<div class="shell"><nav id="nav" aria-label="Menu"></nav><main id="main"></main></div>`;
  renderNav();
  ({ "do-boc": viewTakeoff, "vat-lieu": viewBill, "toi-uu": viewOptimize, "kiem-soat": viewDataCheck,
     "danh-muc": viewCatalog, "gia": viewOffers, "mo-hinh": viewModels })[r]($("main"));
}

// ------------------------------------------------------------------ đăng nhập (chọn vai trò; chưa có xác thực)
function loginView() {
  return `<div class="login"><div class="left"><div class="brand">${logo("#7FD6BF")} OptiMat AI</div>
    <div><h1>Từ bản vẽ đến phương án vật liệu tối ưu</h1><p>Đọc bản vẽ DXF, đo bóc khối lượng tường, tra vật liệu và giá theo danh mục, đề xuất phương án cân bằng chi phí, thời gian cung ứng và khả năng cách nhiệt.</p></div>
    <div class="chips"><span>AI Agent</span><span>XGBoost</span><span>NSGA-II</span></div></div>
    <div class="right"><div class="roles"><div><h2 style="margin:0 0 4px;font-size:26px">Chọn vai trò</h2><p class="muted" style="margin:0">Chưa có đăng nhập và phân quyền; chọn vai trò để vào giao diện tương ứng.</p></div>
    <a class="role primary" href="#do-boc" onclick="store.set('optimat-role','user')"><span><b>Người dùng</b><span>Chủ nhà, kỹ sư, nhà thầu: tải bản vẽ, kiểm tra đo bóc, xem vật liệu, giá và phương án</span></span></a>
    <a class="role" href="#kiem-soat" onclick="store.set('optimat-role','admin')"><span><b>Quản trị viên</b><span>Kiểm soát dữ liệu vật liệu, phương án tường, giá, nhà cung cấp và mô hình</span></span></a></div></div></div>`;
}

function steps(cur) {
  const n = confirmedPlans().length;
  const list = [["do-boc", "1. Bản vẽ và đo bóc", n > 0], ["vat-lieu", "2. Vật liệu và giá", false], ["toi-uu", "3. Tối ưu", false]];
  return `<ol class="steps">${list.map(([k, t, done]) => `<li><a href="#${k}" class="${done && k !== cur ? "done" : ""}" ${k === cur ? 'aria-current="step"' : ""}>${t}</a></li>`).join("")}</ol>`;
}

// ------------------------------------------------------------------ người dùng: đo bóc (trang Kiểm tra bóc tách trong khung)
function viewTakeoff(main) {
  main.className = "full";
  const project = store.get("optimat-project", "");
  main.innerHTML = `<div class="review-bar">${steps("do-boc")}
    <label class="filters" title="Có mã dự án và PostgreSQL: kết quả chốt được lưu vào bảng takeoff_results">Mã dự án <input id="project" type="number" min="1" value="${esc(project)}" placeholder="không bắt buộc" style="width:140px"></label>
    <a class="btn primary" href="#vat-lieu" style="display:inline-flex;align-items:center;text-decoration:none">Tiếp: vật liệu và giá</a></div>
    <iframe class="review" id="review" title="Kiểm tra bóc tách" src="/ui/takeoff${project ? "?project=" + encodeURIComponent(project) : ""}"></iframe>`;
  $("project").addEventListener("change", (e) => { store.set("optimat-project", e.target.value); viewTakeoff(main); });
}

// ------------------------------------------------------------------ người dùng: vật liệu và giá
async function viewBill(main) {
  main.className = "";
  const plans = confirmedPlans(), groups = mergedGroups();
  main.innerHTML = `${steps("vat-lieu")}<div class="head"><div><h1>Vật liệu và giá theo thiết kế</h1>
    <p>Gộp ${plans.length} mặt bằng đã xác nhận. Mã vật liệu là mã danh mục, giá lấy nguyên từ cơ sở dữ liệu; dòng thiếu số liệu để trống và ghi rõ thiếu gì.</p></div>
    <div class="filters"><button class="btn" id="clear" type="button" ${plans.length ? "" : "disabled"}>Xóa kết quả đã lưu</button><a class="btn primary" href="#toi-uu" style="display:inline-flex;align-items:center;text-decoration:none">Tiếp: tối ưu</a></div></div>
    <div id="body"></div>`;
  $("clear").addEventListener("click", () => { store.set("optimat-confirmed", []); renderNav(); viewBill(main); });
  const body = $("body");
  if (!groups.length) { body.innerHTML = `<div class="empty">Chưa có mặt bằng nào được xác nhận. Vào <a href="#do-boc">Hồ sơ và đo bóc</a>, mở bản vẽ, kiểm tra rồi bấm "Xác nhận bản vẽ".</div>`; return; }

function billTable(bill) {
  const costs = bill.map((b) => b.est_cost), total = costs.length && costs.every((c) => c != null) ? costs.reduce((a, b) => a + b, 0) : null;
  const miss = bill.filter((b) => b.missing.length);
  return `<div class="tw"><table><thead><tr><th>Nhóm tường</th><th>Vật liệu</th><th class="n">Khối lượng</th><th class="n">Giá thấp nhất</th><th>Nguồn giá</th><th class="n">Thành tiền</th></tr></thead><tbody>${
    bill.map((b) => { const o = b.offers.find((x) => x.price != null);
      return `<tr><td>${esc(b.wall_type)} ${ROLE[b.role] || ""}<div class="small muted">${esc(b.wall_system_id || "")}</div></td>
      <td>${b.kind === "mortar" ? "Vữa " : ""}${b.material_id ? esc(b.material_id) + `<div class="small muted">${esc(b.material_name || "")}</div>` : pill("warn", "chưa chọn")}</td>
      <td class="n">${b.quantity == null ? pill("warn", "thiếu") : nf(b.quantity) + " " + esc(b.unit || "")}</td>
      <td class="n">${o ? money(o.price) : pill("warn", "chưa có giá")}</td>
      <td>${o ? (o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.supplier_name || o.supplier_id || "")}</a>` : esc(o.supplier_name || o.price_level || "")) + (o.data_kind && o.data_kind !== "ACTUAL" ? " " + pill("info", o.data_kind) : "") : ""}</td>
      <td class="n">${money(b.est_cost)}</td></tr>`; }).join("")
  }</tbody><tfoot><tr><td colspan="5">Tổng tiền vật liệu (chưa gồm vận chuyển, nhân công)</td><td class="n">${total == null ? "chưa đủ giá" : money(total)}</td></tr></tfoot></table></div>
  ${miss.length ? `<ul class="notes">${miss.map((b) => `<li>Tường ${esc(b.wall_type)} ${ROLE[b.role] || ""}, ${b.kind === "mortar" ? "vữa" : "vật liệu"} ${esc(b.material_id || "")}: thiếu ${esc(b.missing.join(", "))}</li>`).join("")}</ul>` : ""}`;
}

      <div class="chat" id="chat"><div class="msg bot">Nêu yêu cầu bằng tiếng Việt, ví dụ: "Ngõ chỉ xe 2,5 tấn vào được, ngân sách 150 triệu, cần hàng trong 1 tuần, không dùng gạch nung". Tôi điền vào ô ràng buộc để bạn kiểm tra rồi chạy.</div></div>
      <form class="chat-in" id="chatForm"><label for="chatText" style="position:absolute;width:1px;height:1px;overflow:hidden">Nhập yêu cầu</label><input id="chatText" placeholder="Nhập yêu cầu" autocomplete="off"><button class="btn" type="submit" style="background:var(--ink);color:var(--card)">Gửi</button></form></section>
  </div><div id="result"></div>`;
  const read = () => ({
    budget: $("budget").value ? Number($("budget").value) : null, deadline_days: $("deadline").value ? Number($("deadline").value) : null,

  $("chatForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("chatText").value.trim(); if (!text) return;
    const chat = $("chat"); chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(text)}</div>`); $("chatText").value = "";

      if (p.deadline_days != null) { $("deadline").value = p.deadline_days; got.push(`hạn ${p.deadline_days} ngày`); }

      if ((p.excluded_materials || []).length) got.push("loại " + p.excluded_materials.map((f) => (FAMILIES.find((x) => x[0] === f) || [f, f])[1]).join(", "));
      store.set("optimat-constraints", read());
      chat.insertAdjacentHTML("beforeend", `<div class="msg bot">${got.length ? "Đã ghi nhận: " + esc(got.join("; ")) + "." : "Tôi chưa nhận ra ràng buộc nào trong câu này."} (bộ trích: ${esc(p.source)})</div>`);
    } catch (err) { chat.insertAdjacentHTML("beforeend", `<div class="msg bot">${esc(err.message)}</div>`); }
    chat.scrollTop = chat.scrollHeight;
  });

    e.preventDefault();
    const cons = read(); store.set("optimat-constraints", cons);
    const out = $("result"); out.innerHTML = `<div class="card muted">Đang tối ưu…</div>`;
    try { out.innerHTML = solutionsView(await post("/api/optimize", { groups, constraints: cons })); }
    catch (err) { out.innerHTML = `<div class="card"><div class="note">${esc(err.message)}</div></div>`; }
  });
}
function solutionsView(r) {
  const sols = r.solutions || [];
  const picks = sols.length ? [["Chi phí thấp nhất", sols[0]], ["Cung ứng nhanh nhất", [...sols].sort((a, b) => a.supply_days - b.supply_days || a.total_cost - b.total_cost)[0]],
    ["Cách nhiệt tốt nhất", [...sols].sort((a, b) => a.u_value - b.u_value || a.total_cost - b.total_cost)[0]]] : [];
  const card = ([label, s]) => `<div class="card" style="flex:1 1 280px"><h2>${esc(label)}</h2>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)"><div><div class="muted small">Tổng</div><b>${money(s.total_cost)} đ</b></div><div><div class="muted small">Cung ứng</div><b>${s.supply_days} ngày</b></div><div><div class="muted small">U</div><b>${nf(s.u_value, 3)}</b></div></div>
    <div class="tw"><table><tbody>${s.choices.map((c) => `<tr><td>${esc(c.wall_type)}<div class="small muted">${esc(c.wall_system_id || "")}</div></td><td>${esc(c.material_name)}<div class="small muted">${nf(c.quantity)} ${esc(c.unit)} × ${money(c.unit_price)} (${c.price_source === "model" ? "mô hình" : "danh mục"})</div></td><td>${c.product_url ? `<a href="${esc(c.product_url)}" target="_blank" rel="noopener">${esc(c.supplier_name)}</a>` : esc(c.supplier_name)}<div class="small muted">${nf(c.distance_km, 1)} km · ${c.trips} chuyến ${esc(c.vehicle_id)}</div></td></tr>`).join("")}</tbody></table></div></div>`;
  return `${sols.length ? `<div class="row">${picks.map(card).join("")}</div>
    <div class="card"><h2>Tập Pareto: ${sols.length} phương án không bị trội (đã xét ${r.n_evaluated} tổ hợp)</h2><div class="tw"><table><thead><tr><th>#</th><th class="n">Tổng đồng</th><th class="n">Ngày</th><th class="n">U</th><th>Lựa chọn</th></tr></thead><tbody>${
      sols.map((s, i) => `<tr><td>${i + 1}</td><td class="n">${money(s.total_cost)}</td><td class="n">${s.supply_days}</td><td class="n">${nf(s.u_value, 3)}</td><td class="small">${s.choices.map((c) => esc(`${c.wall_type}: ${c.wall_system_id || c.material_id} · ${c.supplier_name} · ${c.vehicle_id}`)).join("<br>")}</td></tr>`).join("")}</tbody></table></div></div>`
    : `<div class="card"><div class="note">Không có phương án nào thỏa ràng buộc.</div></div>`}
    ${(r.notes || []).length ? `<div class="card"><h2>Ghi chú của bước tối ưu</h2><ul class="notes">${r.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}`;
}

    $("body").className = "card";
    $("body").innerHTML = `<h2>${rows.length} dòng giá</h2><div class="tw"><table><thead><tr><th>Vật liệu</th><th>Nhà cung cấp</th><th class="n">Giá</th><th>Mức giá</th><th>Ngày</th><th>Loại dữ liệu</th><th>Liên kết</th></tr></thead><tbody>${
      rows.map((r) => `<tr><td><b>${esc(r.material_id)}</b><div class="small muted">${esc(r.material_name || "")}</div></td><td>${esc(r.name || r.supplier_id)}<div class="small muted">${esc(r.province || "")}</div></td><td class="n">${r.base_price == null ? pill("warn", "không công khai") : money(r.base_price)}</td><td>${esc(r.price_level || "")}</td><td>${esc(r.price_date || "")}</td><td>${pill(r.data_kind === "ACTUAL" ? "ok" : "info", r.data_kind || "?")}</td><td>${r.product_url || r.maps_url ? `<a href="${esc(r.product_url || r.maps_url)}" target="_blank" rel="noopener">mở</a>` : pill("warn", "chưa có")}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Chưa có dòng giá.</td></tr>`
    }</tbody></table></div>`;
  } catch (err) { $("body").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
}
async function viewModels(main) {
  main.className = "";
  main.innerHTML = `<div class="head"><div><h1>Mô hình và cấu hình</h1><p>Mô hình giá XGBoost huấn luyện trên máy (<code>python -m optimat.predict.train</code>); chỉ số chỉ dùng để báo cáo khi dữ liệu là ACTUAL.</p></div></div><div id="body" class="muted">Đang tải…</div>`;
  try {
    const [m, h] = await Promise.all([api("/api/models"), api("/api/health")]);
    const met = m.metrics && m.metrics.metrics_on_test ? Object.entries(m.metrics.metrics_on_test) : [];
    const keys = met.length ? Object.keys(met[0][1]) : [];
    $("body").className = "row";
    $("body").innerHTML = `<div class="card" style="flex:2 1 460px"><h2>Mô hình dự đoán giá ${m.loaded ? pill("ok", "đã nạp") : pill("warn", "chưa huấn luyện")}</h2>
      ${met.length ? `<div class="tw"><table><thead><tr><th>Mô hình</th>${keys.map((k) => `<th class="n">${esc(k)}</th>`).join("")}</tr></thead><tbody>${met.map(([name, v]) => `<tr><td><b>${esc(name)}</b></td>${keys.map((k) => `<td class="n">${typeof v[k] === "number" ? nf(v[k], 4) : esc(v[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
        ${m.metrics.contains_synthetic ? `<div class="note">Mô hình học trên dữ liệu có dòng MÔ PHỎNG: không dùng các chỉ số này để báo cáo.</div>` : ""}` : `<div class="empty">Chưa có <code>models/material_price_metrics.json</code>. Chạy huấn luyện để có bảng chỉ số.</div>`}</div>
      <div class="card" style="flex:1 1 280px"><h2>Cấu hình đang chạy</h2><table><tbody>
        <tr><td>Nguồn danh mục</td><td>${esc(h.catalog_source)}</td></tr>
        <tr><td>NSGA-II</td><td>quần thể ${m.nsga.pop_size}, ${m.nsga.generations} thế hệ</td></tr>
        <tr><td>Mô hình ngôn ngữ</td><td>${esc(m.llm_provider)} · ${esc(m.llm_model)} ${m.llm_available ? pill("ok", "sẵn sàng") : pill("warn", "chưa có khóa, chạy luồng cố định")}</td></tr>
        <tr><td>Chuyển DWG (ODA)</td><td>${h.dwg_converter_available ? pill("ok", "có") : pill("warn", "chưa cài")}</td></tr></tbody></table>
        <p class="small muted" style="margin:0">Sửa cấu hình trong <code>src/optimat/config.py</code> và biến môi trường.</p></div>`;
  } catch (err) { $("body").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
}

render();
</script>
</body>

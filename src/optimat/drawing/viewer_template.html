<title>Xem bóc tách bản vẽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bố cục: bàn vẽ bên trái chiếm phần lớn, cột giải thích bước bên phải; thanh 5 bước nằm trên cùng. */
:root {
  --paper: #f3f5f2;      /* nền bàn vẽ, xám hơi ngả xanh */
  --panel: #ffffff;
  --ink: #1d2422;
  --muted: #5d6b67;
  --rule: #d6ddd9;
  --line: #9aa7a2;       /* nét gốc không phải tường */
  --wall-line: #27302d;  /* nét gốc trên layer tường */
  --c110: #1f8a7a;       /* lớp tường 110 */
  --c150: #6b8f23;
  --c220: #c7741a;       /* lớp tường 220 */
  --c330: #5a55b8;       /* lớp tường 330 */
  --concrete: #7d8784;
  --open: #d1453b;
  --accent: #1f6f8b;
  --sel: #e8b500;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131817; --panel: #1b2120; --ink: #e4ebe8; --muted: #9aaaa5; --rule: #2e3735;
    --line: #56625e; --wall-line: #d5ddda; --c110: #3fbfa9; --c150: #9cc24a; --c220: #f0a14a; --c330: #9b96f0;
    --concrete: #8e9895; --open: #ff7a6e; --accent: #5cb6d6; --sel: #ffd23f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131817; --panel: #1b2120; --ink: #e4ebe8; --muted: #9aaaa5; --rule: #2e3735;
  --line: #56625e; --wall-line: #d5ddda; --c110: #3fbfa9; --c150: #9cc24a; --c220: #f0a14a; --c330: #9b96f0;
  --concrete: #8e9895; --open: #ff7a6e; --accent: #5cb6d6; --sel: #ffd23f; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--panel); color: var(--ink); font: 14px/1.5 var(--f-ui); }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px 8px; border-bottom: 1px solid var(--rule); }
header h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
header .file { font-family: var(--f-num); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.plansel { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.plansel select { font: 600 13px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; max-width: 70vw; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip { font-family: var(--f-num); font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 999px; white-space: nowrap; }
.chip b { font-weight: 600; }
.steps { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.steps button { all: unset; cursor: pointer; padding: 10px 14px 9px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted); font-weight: 500; }
.steps button .n { font-family: var(--f-num); font-size: 12px; margin-right: 6px; }
.steps button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.board { position: relative; background: var(--paper); min-height: 0; overflow: hidden; touch-action: none; }
.board svg { width: 100%; height: 100%; display: block; cursor: grab; }
.board svg.drag { cursor: grabbing; }
.tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
.tools button { font: 500 13px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.tools button:focus-visible { outline: 2px solid var(--accent); }
.scale { position: absolute; right: 12px; bottom: 12px; font-family: var(--f-num); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 12px; min-width: 180px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
.tip b { font-family: var(--f-num); }
aside { border-left: 1px solid var(--rule); overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
aside h2 { font-size: 15px; margin: 0; text-wrap: balance; }
aside p { margin: 0; color: var(--muted); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 11.5px; }
td:last-child { overflow-wrap: anywhere; }
td.num, th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.role { font-size: 11px; font-family: var(--f-num); padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); }
.role.WALL { border-color: var(--wall-line); color: var(--ink); font-weight: 600; }
.role.OPENING { border-color: var(--open); color: var(--open); }
.warn { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.warn li { padding: 6px 8px; border-left: 3px solid var(--sel); background: color-mix(in srgb, var(--sel) 10%, transparent); font-size: 12.5px; }
.detail { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 12.5px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; font-family: var(--f-num); overflow-wrap: anywhere; }
.bad { color: var(--open); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; }
@media (max-width: 820px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .board { height: 62vh; }
  aside { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
}
@media (prefers-reduced-motion: no-preference) { .steps button { transition: color .15s, border-color .15s; } }
</style>

<div class="app">
  <header>
    <h1>Xem bóc tách bản vẽ</h1>
    <span class="file" id="file"></span>
    <label class="plansel" id="plansel" hidden><span>Mặt bằng</span> <select id="plan"></select></label>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="steps" role="tablist" id="steps"></nav>
  <div class="main">
    <div class="board" id="board">
      <svg id="svg" role="img" aria-label="Mặt bằng và kết quả nhận diện tường"></svg>
      <div class="tools">
        <button type="button" id="fit">Vừa khung</button>
        <button type="button" id="zin" aria-label="Phóng to">+</button>
        <button type="button" id="zout" aria-label="Thu nhỏ">−</button>
      </div>
      <div class="scale" id="scale"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>

<script>
const ALL = /*__DATA__*/null;
let PI = 0;
{ const m = /^#p(\d+)$/.exec(location.hash || ""); if (m && +m[1] < ALL.plans.length) PI = +m[1]; }
const D = ALL.plans[PI];
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 2) => Number(v).toLocaleString("vi-VN", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clsColor = (c) => `var(--c${["110", "150", "220", "330"].includes(c) ? c : "110"})`;
const ROLE_VI = { WALL: "tường", OPENING: "cửa", ANNOTATION: "ghi chú", IGNORE: "bỏ qua", UNKNOWN: "chưa rõ" };
const SRC_VI = { text: "ghi chú", hatch: "hatch", layer: "layer", none: "không có" };

const STEPS = [
  { key: "raw", name: "Nét và layer" },
  { key: "walls", name: "Ghép cặp thành tường" },
  { key: "open", name: "Trừ lỗ mở" },
  { key: "mat", name: "Gán vật liệu" },
  { key: "qty", name: "Bảng khối lượng" },
];
let step = 0, selected = null;

// ---------- vẽ ----------
const svg = $("svg");
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const [W, H] = D.size;
const unit = Math.max(W, H) / 100;            // kích thước chữ, điểm đánh dấu theo cỡ bản vẽ
const G = {};
["hatch", "raw", "walls", "open", "mat", "text"].forEach((k) => (G[k] = el("g", { "data-layer": k }, svg)));

// nét gốc: gom theo vai trò layer để tô màu
const roleOf = D.layers.map((l) => l.role);
const wallLayerSet = new Set(D.wall_layers || []);
const paths = {};
const hatchPaths = [];
for (const [x1, y1, x2, y2, li, isH] of D.segs) {
  if (isH) { hatchPaths.push(`M${x1} ${y1}L${x2} ${y2}`); continue; }
  const r = wallLayerSet.has(D.layers[li].name) ? "WALL" : roleOf[li];
  (paths[r] = paths[r] || []).push(`M${x1} ${y1}L${x2} ${y2}`);
}
const rawStyle = {
  WALL: { stroke: "var(--wall-line)", w: 1.4 }, OPENING: { stroke: "var(--open)", w: 1 },
  ANNOTATION: { stroke: "var(--line)", w: 0.6, op: 0.6 }, IGNORE: { stroke: "var(--line)", w: 0.6, op: 0.45 },
  UNKNOWN: { stroke: "var(--line)", w: 0.8, op: 0.8 },
};
for (const r in paths) {
  const s = rawStyle[r] || rawStyle.UNKNOWN;
  el("path", { d: paths[r].join(""), fill: "none", stroke: s.stroke, "stroke-width": s.w, opacity: s.op ?? 1,
               "vector-effect": "non-scaling-stroke", "data-role": r }, G.raw);
}

// nét hatch bị phá: vẽ rất mờ
if (hatchPaths.length) el("path", { d: hatchPaths.join(""), fill: "none", stroke: "var(--line)", "stroke-width": 0.4,
  opacity: 0.35, "vector-effect": "non-scaling-stroke" }, G.hatch);
// hatch
for (const h of D.hatches) {
  if (h.pattern === "*EXPLODED*") continue;
  for (const poly of h.polys) {
    el("polygon", { points: poly.map((p) => p.join(",")).join(" "),
      fill: h.concrete ? "var(--concrete)" : h.rule ? "var(--accent)" : "var(--line)", "fill-opacity": 0.18,
      stroke: "none" }, G.hatch);
  }
}

// tường: dải rộng đúng chiều dày lớp, dọc theo trục tim
const wallEls = {};
for (const w of D.walls) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1, L = Math.hypot(dx, dy) || 1;
  const t = Number(w.cls) / 2, nx = (-dy / L) * t, ny = (dx / L) * t;
  const pts = [[w.x1 + nx, w.y1 + ny], [w.x2 + nx, w.y2 + ny], [w.x2 - nx, w.y2 - ny], [w.x1 - nx, w.y1 - ny]];
  const color = w.masonry ? clsColor(w.cls) : "var(--concrete)";
  const g = el("g", { class: "wall", "data-id": w.id, tabindex: 0 }, G.walls);
  el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill: color, "fill-opacity": 0.32,
    stroke: color, "stroke-width": w.role === "envelope" ? 2.2 : 1.2, "vector-effect": "non-scaling-stroke",
    "stroke-dasharray": w.masonry ? "" : "4 3" }, g);
  el("line", { x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2, stroke: color, "stroke-width": 1, "stroke-dasharray": "6 4",
    "vector-effect": "non-scaling-stroke" }, g);
  wallEls[w.id] = g;
  g.addEventListener("pointerenter", (e) => showTip(e, wallTip(w)));
  g.addEventListener("pointermove", moveTip);
  g.addEventListener("pointerleave", hideTip);
  g.addEventListener("click", () => select(w.id));
  g.addEventListener("keydown", (e) => { if (e.key === "Enter") select(w.id); });
}

// cung cánh cửa (dấu hiệu nhận cửa đi)
for (const [cx, cy, r, a0, a1] of D.arcs || []) {
  const s0 = a0 * Math.PI / 180, s1 = a1 * Math.PI / 180;
  const sweep = ((a1 - a0) % 360 + 360) % 360;
  if (sweep < 60 || sweep > 120 || r < 450 || r > 1300) continue;
  // trục y đã lật: góc đổi dấu
  const p0 = [cx + r * Math.cos(s0), cy - r * Math.sin(s0)], p1 = [cx + r * Math.cos(s1), cy - r * Math.sin(s1)];
  el("path", { d: `M${p0[0]} ${p0[1]}A${r} ${r} 0 0 0 ${p1[0]} ${p1[1]}`, fill: "none", stroke: "var(--open)",
    "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.8, "vector-effect": "non-scaling-stroke" }, G.open);
}
// lỗ mở: chấm tại điểm chèn, đường nối tới tường đã trừ
const wallById = Object.fromEntries(D.walls.map((w) => [w.id, w]));
for (const o of D.openings) {
  const w = wallById[o.wall];
  const color = w ? "var(--open)" : "var(--sel)";
  if (w) {
    const dx = w.x2 - w.x1, dy = w.y2 - w.y1, L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((o.x - w.x1) * dx + (o.y - w.y1) * dy) / L2));
    el("line", { x1: o.x, y1: o.y, x2: w.x1 + t * dx, y2: w.y1 + t * dy, stroke: color, "stroke-width": 1.2,
      "vector-effect": "non-scaling-stroke" }, G.open);
  }
  const c = el("circle", { cx: o.x, cy: o.y, r: unit * 0.9, fill: color, "fill-opacity": 0.85 }, G.open);
  const tx = el("text", { x: o.x + unit * 1.3, y: o.y - unit * 0.8, "font-size": unit * 2, fill: color,
    "font-family": "var(--f-num)", "font-weight": 600 }, G.open);
  tx.textContent = o.name;
  c.addEventListener("pointerenter", (e) => showTip(e,
    `<b>${esc(o.name)}</b><br>${fmt(o.w / 1000)} × ${fmt(o.h / 1000)} m · ${esc(o.ev || "")}<br>` +
    (w ? `Trừ vào tường <b>${esc(w.id)}</b>` : `<span class="bad">Không gần tường nào, chưa trừ</span>`)));
  c.addEventListener("pointermove", moveTip);
  c.addEventListener("pointerleave", hideTip);
}

// nhãn vật liệu ở giữa mỗi tường
for (const w of D.walls) {
  const label = !w.masonry ? "bê tông" : w.mat ? w.mat : w.fam ? w.fam + "?" : "?";
  const t = el("text", { x: (w.x1 + w.x2) / 2, y: (w.y1 + w.y2) / 2 - unit * 0.6, "font-size": unit * 1.7,
    "text-anchor": "middle", fill: w.mat || !w.masonry ? "var(--ink)" : "var(--open)", "font-family": "var(--f-num)",
    "paint-order": "stroke", stroke: "var(--paper)", "stroke-width": unit * 0.5 }, G.mat);
  t.textContent = label;
}

// ghi chú trong bản vẽ
for (const t of D.texts) {
  const e = el("text", { x: t.x, y: t.y, "font-size": unit * 1.6, fill: "var(--muted)" }, G.text);
  e.textContent = t.t;
}

// ---------- hiển thị theo bước ----------
const VIS = {
  raw:   { hatch: 1, raw: 1, walls: 0, open: 0, mat: 0, text: 1 },
  walls: { hatch: 0, raw: 1, walls: 1, open: 0, mat: 0, text: 0 },
  open:  { hatch: 0, raw: 1, walls: 1, open: 1, mat: 0, text: 0 },
  mat:   { hatch: 1, raw: 1, walls: 1, open: 0, mat: 1, text: 1 },
  qty:   { hatch: 0, raw: 1, walls: 1, open: 1, mat: 1, text: 0 },
};
function applyStep() {
  const v = VIS[STEPS[step].key];
  for (const k in G) G[k].style.display = v[k] ? "" : "none";
  G.raw.style.opacity = step === 0 ? 1 : 0.45;
  [...$("steps").children].forEach((b, i) => b.setAttribute("aria-selected", i === step));
  renderPanel();
  try { localStorage.setItem("optimat-viewer-step", step); } catch (e) {}
}
STEPS.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "tab");
  b.innerHTML = `<span class="n">${i + 1}</span>${s.name}`;
  b.addEventListener("click", () => { step = i; applyStep(); });
  $("steps").appendChild(b);
});

// ---------- cột giải thích ----------
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
function legendWalls() {
  const classes = [...new Set(D.walls.map((w) => w.cls))].sort();
  return `<div class="legend">${classes.map((c) => `<span><i class="sw" style="background:${clsColor(c)}"></i>Tường ${c}</span>`).join("")}
    <span><i class="sw" style="background:var(--concrete)"></i>Bê tông (loại)</span></div>
    <p style="margin-top:6px">Viền đậm: tường bao che. Nét đứt giữa dải: trục tim, chiều dài đo theo trục này.</p>`;
}
function detailBox() {
  if (!selected) return `<div class="detail"><p>Bấm vào một đoạn tường trên bản vẽ để xem chi tiết.</p></div>`;
  const w = wallById[selected];
  const ops = D.openings.filter((o) => o.wall === w.id);
  return `<div class="detail"><p class="label">Đoạn tường ${esc(w.id)}</p><dl>
    <dt>Lớp chiều dày</dt><dd>${w.cls} mm</dd>
    <dt>Vai trò</dt><dd>${w.role === "envelope" ? "bao che" : "ngăn"}</dd>
    <dt>Layer</dt><dd>${esc(w.layer)}</dd>
    <dt>Chiều dài</dt><dd>${fmt(w.len)} m</dd>
    <dt>Độ tin cậy</dt><dd>${fmt(w.conf)}</dd>
    <dt>Lỗ mở đã trừ</dt><dd>${ops.length ? ops.map((o) => esc(o.name)).join(", ") + ` · ${fmt(w.open)} m²` : "không"}</dd>
    <dt>Vật liệu</dt><dd>${w.masonry ? (w.mat ? esc(w.mat) + (w.sys ? " · " + esc(w.sys) : " · chưa có phương án tường") : w.fam ? esc(w.fam) + ' <span class="bad">nhiều phương án: ' + esc((w.cand || []).join(", ")) + "</span>" : '<span class="bad">chưa xác định</span>') : "bê tông, không tính"}</dd>
    <dt>Nguồn</dt><dd>${SRC_VI[w.src] || esc(w.src)}${w.rule ? " · quy tắc " + esc(w.rule) : ""}</dd>
  </dl></div>`;
}
function warningsBox() {
  if (!D.warnings.length) return "";
  return `<div><p class="label">Cảnh báo (${D.warnings.length})</p><ul class="warn">${D.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
}
function renderPanel() {
  const P = $("panel");
  const k = STEPS[step].key;
  let h = "";
  if (k === "raw") {
    const counts = {};
    D.segs.forEach((s) => (counts[s[4]] = (counts[s[4]] || 0) + 1));
    h = `<div><h2>Bước 1. Đọc nét và phân loại layer</h2>
      <p>Hệ thống đọc ${D.segs.length.toLocaleString("vi-VN")} đoạn nét, ${D.texts.length} ghi chú, ${D.openings.length} block cửa.
      Layer tường lấy theo tên (TUONG, WALL…) cộng với layer tự nhận bằng hình học.</p></div>
      <div><p class="label">Layer</p><div class="tablewrap"><table><thead><tr><th>Tên layer</th><th>Vai trò</th><th class="num">Số nét</th><th class="num">Cặp nét (m)</th></tr></thead><tbody>
      ${D.layers.map((l, i) => [l, i]).filter(([l, i]) => counts[i]).map(([l, i]) => {
        const used = wallLayerSet.has(l.name), auto = (D.auto_wall_layers || []).includes(l.name);
        const role = used ? "WALL" : l.role;
        return `<tr><td>${esc(l.name)}</td><td><span class="role ${role}">${ROLE_VI[role] || role}</span>${auto ? ' <span class="role">tự nhận</span>' : ""}</td><td class="num">${counts[i] || 0}</td><td class="num">${D.wall_layer_scores && D.wall_layer_scores[l.name] ? fmt(D.wall_layer_scores[l.name] / 1000, 1) : ""}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p style="margin-top:6px">Cột cuối: tổng mét cặp nét song song đúng chiều dày tường (có hatch ở giữa nếu bản vẽ tô hatch tường). Layer điểm cao được tự nhận là layer tường. ${D.hatchsegs ? `${D.hatchsegs.toLocaleString("vi-VN")} nét hatch bị phá được nhận ra và loại khỏi việc ghép tường (vẽ mờ).` : ""}</p></div>`;
  } else if (k === "walls") {
    const by = {};
    D.walls.forEach((w) => { const b = (by[w.cls] = by[w.cls] || { n: 0, L: 0 }); b.n++; b.L += w.len; });
    h = `<div><h2>Bước 2. Ghép cặp nét song song thành tường</h2>
      <p>Hai nét song song trên layer tường, cách nhau đúng một lớp chiều dày (110, 220, 330), được ghép thành một đoạn tường.
      Chiều dài tính theo đoạn hai nét chồng nhau.</p></div>${legendWalls()}
      <div class="tablewrap"><table><thead><tr><th>Lớp</th><th class="num">Số đoạn</th><th class="num">Dài (m)</th></tr></thead><tbody>
      ${Object.keys(by).sort().map((c) => `<tr><td><i class="sw" style="background:${clsColor(c)}"></i>${c}</td><td class="num">${by[c].n}</td><td class="num">${fmt(by[c].L)}</td></tr>`).join("")}
      </tbody></table></div>${detailBox()}`;
  } else if (k === "open") {
    h = `<div><h2>Bước 3. Trừ diện tích lỗ mở</h2>
      <p>Cửa nhận từ ba dấu hiệu: block cửa, cung cánh cửa (nét đứt đỏ) hoặc nét kính nằm trong khe tường. Tường bị ngắt tại cửa
      được nối lại rồi trừ rộng × cao (cao không vượt chiều cao tầng ${fmt(D.height_mm / 1000)} m). Chấm vàng là cửa không gần tường nào.</p></div>
      <div class="tablewrap"><table><thead><tr><th>Lỗ mở</th><th class="num">Rộng × cao (m)</th><th>Nhận từ</th><th>Tường</th></tr></thead><tbody>
      ${D.openings.map((o) => `<tr><td>${esc(o.name)}</td><td class="num">${fmt(o.w / 1000)} × ${fmt(o.h / 1000)}</td><td>${esc(o.ev || "")}</td><td>${o.wall ? esc(o.wall) : '<span class="bad">chưa trừ</span>'}</td></tr>`).join("") || `<tr><td colspan="4">Không nhận được lỗ mở nào.</td></tr>`}
      </tbody></table></div>${detailBox()}`;
  } else if (k === "mat") {
    const hits = Object.entries(D.rule_hits);
    const um = Object.entries(D.unmatched);
    h = `<div><h2>Bước 4. Gán vật liệu theo quy tắc</h2>
      <p>Vật liệu lấy từ ghi chú, hatch hoặc tên layer theo file quy tắc. Không quy tắc nào khớp thì để trống (dấu ?), hệ thống không đoán.</p></div>
      <div><p class="label">Quy tắc đã khớp</p><div class="tablewrap"><table><thead><tr><th>Quy tắc</th><th class="num">Số tường</th></tr></thead><tbody>
      ${hits.map(([r, n]) => `<tr><td>${esc(r)}</td><td class="num">${n}</td></tr>`).join("") || `<tr><td colspan="2">Không có.</td></tr>`}</tbody></table></div></div>
      <div><p class="label">Tín hiệu chưa có quy tắc</p>${um.length ? um.map(([kind, vals]) => `<p><b>${esc(kind)}</b>: ${vals.map(esc).join("; ")}</p>`).join("") : "<p>Không có.</p>"}</div>
      ${detailBox()}`;
  } else {
    h = `<div><h2>Bước 5. Bảng khối lượng</h2>
      <p>Diện tích = chiều dài × chiều cao tầng ${fmt(D.height_mm / 1000)} m − lỗ mở. Tường bê tông không tính.</p></div>
      <div class="tablewrap"><table><thead><tr><th>Loại</th><th>Vai trò</th><th class="num">Dài m</th><th class="num">Lỗ mở m²</th><th class="num">Thực m²</th><th>Vật liệu</th></tr></thead><tbody>
      ${D.groups.map((g) => `<tr><td><i class="sw" style="background:${clsColor(g.wall_type)}"></i>${g.wall_type}</td><td>${g.role === "envelope" ? "bao che" : "ngăn"}</td>
        <td class="num">${fmt(g.length_m)}</td><td class="num">${fmt(g.opening_area_m2)}</td><td class="num"><b>${fmt(g.net_area_m2)}</b></td>
        <td>${g.design_material_id ? esc(g.design_material_id) + ` <span class="role">${Math.round(g.design_material_share * 100)}%</span>` : '<span class="bad">chưa rõ</span>'}</td></tr>`).join("")}
      </tbody></table></div>${detailBox()}`;
  }
  P.innerHTML = h + warningsBox();
}

// ---------- chọn tường ----------
function select(id) {
  for (const g of Object.values(wallEls)) g.querySelector("polygon").style.stroke = "";
  selected = selected === id ? null : id;
  if (selected) wallEls[selected].querySelector("polygon").style.stroke = "var(--sel)";
  if (step === 0) step = 1;
  applyStep();
}

// ---------- chú thích nổi ----------
const tip = $("tip");
function wallTip(w) {
  return `<b>${esc(w.id)}</b> · tường ${w.cls} · ${w.role === "envelope" ? "bao che" : "ngăn"}<br>
    Dài <b>${fmt(w.len)} m</b>${w.open ? ` · trừ ${fmt(w.open)} m²` : ""}<br>
    ${w.masonry ? (w.mat ? `Vật liệu ${esc(w.mat)}${w.sys ? " · " + esc(w.sys) : ""} (${SRC_VI[w.src] || w.src})` : w.fam ? `Họ ${esc(w.fam)}, còn chọn phương án` : '<span class="bad">Chưa xác định vật liệu</span>') : "Bê tông, không tính"}`;
}
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) {
  const r = $("board").getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x = e.clientX - r.left - tip.offsetWidth - 14;
  if (y + tip.offsetHeight > r.height - 8) y = e.clientY - r.top - tip.offsetHeight - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }

// ---------- phóng, kéo ----------
let vb;
function setVB(v) { vb = v; svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); updateScale(); }
function fit() {
  const pad = Math.max(W, H) * 0.06;
  const r = svg.getBoundingClientRect(), ar = (r.width || 1) / (r.height || 1);
  let w = W + 2 * pad, h = H + 2 * pad;
  if (w / h < ar) w = h * ar; else h = w / ar;
  setVB({ x: (W - w) / 2, y: (H - h) / 2, w, h });
}
function zoom(f, cx, cy) {
  const r = svg.getBoundingClientRect();
  const px = cx == null ? 0.5 : (cx - r.left) / r.width, py = cy == null ? 0.5 : (cy - r.top) / r.height;
  const nw = vb.w * f, nh = vb.h * f;
  setVB({ x: vb.x + (vb.w - nw) * px, y: vb.y + (vb.h - nh) * py, w: nw, h: nh });
}
function updateScale() {
  const r = svg.getBoundingClientRect();
  const mmPerPx = vb.w / (r.width || 1);
  const target = mmPerPx * 100;
  const nice = [100, 200, 500, 1000, 2000, 5000, 10000, 20000].find((n) => n >= target) || 50000;
  $("scale").textContent = `${(100 * nice / target) | 0} px = ${nice >= 1000 ? nice / 1000 + " m" : nice + " mm"}`;
}
svg.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
let drag = null;
svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb } }; svg.classList.add("drag"); });
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  setVB({ ...drag.vb, x: drag.vb.x - (e.clientX - drag.x) * vb.w / r.width, y: drag.vb.y - (e.clientY - drag.y) * vb.h / r.height });
});
window.addEventListener("pointerup", () => { drag = null; svg.classList.remove("drag"); });
$("fit").addEventListener("click", fit);
$("zin").addEventListener("click", () => zoom(1 / 1.4));
$("zout").addEventListener("click", () => zoom(1.4));
window.addEventListener("resize", fit);

// ---------- đầu trang ----------
$("file").textContent = ALL.file;
if (ALL.plans.length > 1) {
  $("plansel").hidden = false;
  $("plan").innerHTML = ALL.plans.map((p, i) => `<option value="${i}" ${i === PI ? "selected" : ""}>${i + 1}. ${esc(p.plan.name)}</option>`).join("");
  $("plan").addEventListener("change", (e) => { location.hash = "p" + e.target.value; location.reload(); });
}
const net = sum(D.groups, (g) => g.net_area_m2);
$("chips").innerHTML =
  `<span class="chip">Chiều cao tầng <b>${fmt(D.height_mm / 1000)} m</b>${D.plan.height_source ? " · " + esc(D.plan.height_source) : ""}</span>` +
  `<span class="chip">${D.walls.length} đoạn tường</span>` +
  `<span class="chip">${D.openings.length} lỗ mở</span>` +
  `<span class="chip">Diện tích tường thực <b>${fmt(net)} m²</b></span>`;

try { const s = Number(localStorage.getItem("optimat-viewer-step")); if (s >= 0 && s < STEPS.length) step = s; } catch (e) {}
fit();
applyStep();
</script>

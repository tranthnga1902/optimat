<title>Kiểm tra bóc tách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bố cục: bàn vẽ bên trái (thanh công cụ nổi), cột danh sách nhận dạng bên phải có 4 tab; thanh đầu trang giữ thao tác chốt. */
:root {
  --paper: #f2f4f1; --panel: #ffffff; --sunk: #f7f8f6; --ink: #1c2321; --muted: #5b6965; --rule: #d5dcd8;
  --line: #9aa7a2; --wall-line: #27302d;
  --c110: #1f8a7a; --c150: #6b8f23; --c220: #c7741a; --c330: #5a55b8; --concrete: #7d8784;
  --open: #d1453b; --accent: #1f6f8b; --accent-ink: #ffffff; --sel: #e0a800; --ok: #2e7d4f; --warn: #b7791f;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131817; --panel: #1b2120; --sunk: #161c1b; --ink: #e4ebe8; --muted: #9aaaa5; --rule: #2e3735;
    --line: #56625e; --wall-line: #d5ddda; --c110: #3fbfa9; --c150: #9cc24a; --c220: #f0a14a; --c330: #9b96f0;
    --concrete: #8e9895; --open: #ff7a6e; --accent: #5cb6d6; --accent-ink: #0f1514; --sel: #ffd23f; --ok: #5cc98a; --warn: #f0b85a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131817; --panel: #1b2120; --sunk: #161c1b; --ink: #e4ebe8; --muted: #9aaaa5; --rule: #2e3735;
  --line: #56625e; --wall-line: #d5ddda; --c110: #3fbfa9; --c150: #9cc24a; --c220: #f0a14a; --c330: #9b96f0;
  --concrete: #8e9895; --open: #ff7a6e; --accent: #5cb6d6; --accent-ink: #0f1514; --sel: #ffd23f; --ok: #5cc98a; --warn: #f0b85a;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 14px/1.45 var(--f-ui); }
button, select, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.file { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.grow { flex: 1 1 auto; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.field select, .field input { font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; }
.field input[type=number] { width: 72px; font-family: var(--f-num); }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:focus-visible, select:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.status { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.status.done { color: var(--ok); border-color: var(--ok); }
.status.edit { color: var(--warn); border-color: var(--warn); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 470px; min-height: 0; }
.board { position: relative; background: var(--paper); min-height: 0; overflow: hidden; touch-action: none; }
/* nền bản vẽ gốc vẽ như phần mềm CAD: nền đen mặc định (giống DWG FastView); nền trắng = đảo màu giữ sắc độ */
.board.cadbg { background: #000; }
.board.cadbg.light { background: #fff; }
.board.light .cadlayer { filter: invert(1) hue-rotate(180deg); }
.board.cadbg .scale { background: rgba(0,0,0,.6); color: #ddd; border-color: #333; }
.ovl-rect { fill: rgba(92,182,214,.06); stroke: #5cb6d6; cursor: pointer; }
.ovl-rect:hover { fill: rgba(92,182,214,.18); }
.board svg { width: 100%; height: 100%; display: block; }
.board[data-mode="select"] svg { cursor: grab; }
.board[data-mode="wall"] svg, .board[data-mode="open"] svg { cursor: crosshair; }
.toolbar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chipset { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; }
.chipset label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.hint { position: absolute; left: 12px; bottom: 12px; max-width: min(520px, calc(100% - 140px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 7px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
.scale { position: absolute; right: 12px; bottom: 12px; font-family: var(--f-num); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
aside { border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
aside .list { flex: 1 1 auto; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); padding: 0 8px; overflow-x: auto; }
.tab { all: unset; cursor: pointer; padding: 10px 10px 8px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-family: var(--f-num); font-size: 11.5px; margin-left: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 12.5px; align-items: center; }
.filters:empty { display: none; }
.pill { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; cursor: pointer; background: var(--panel); font-size: 12.5px; }
.pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.list { overflow-y: auto; min-height: 0; }
.row { display: grid; grid-template-columns: 22px 46px 1fr auto; gap: 4px 8px; padding: 8px 12px; border-bottom: 1px solid var(--rule); align-items: center; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row.sel { background: color-mix(in srgb, var(--sel) 16%, transparent); box-shadow: inset 3px 0 0 var(--sel); }
.row.off { opacity: .5; }
.row.off .rid { text-decoration: line-through; }
.rid { font-family: var(--f-num); font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.rmain { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.rmain select, .rmain input { font-size: 12.5px; border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); padding: 2px 4px; }
.rmain input[type=number] { width: 66px; font-family: var(--f-num); }
.rnum { text-align: right; font-family: var(--f-num); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rnum small { display: block; color: var(--muted); font-size: 11px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.tag.low { border-color: var(--warn); color: var(--warn); }
.tag.man { border-color: var(--accent); color: var(--accent); }
.tag.edit { border-color: var(--sel); color: var(--ink); }
.x { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 15px; padding: 0 4px; }
.x:hover { color: var(--open); }
.empty { padding: 18px 14px; color: var(--muted); }
.qty { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--rule); }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
td.num, th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 700; border-bottom: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.warn { list-style: none; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.warn li { padding: 6px 8px; border-left: 3px solid var(--sel); background: color-mix(in srgb, var(--sel) 10%, transparent); font-size: 12.5px; }
.foot { border-top: 1px solid var(--rule); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--sunk); }
.total { font-size: 13px; }
.total b { font-family: var(--f-num); font-size: 15px; }
.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; padding: 16px; z-index: 10; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; width: min(520px, 100%); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 16px; }
.card p { margin: 0; color: var(--muted); }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.startup { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--muted); }
.startup .card { text-align: left; }
@media (max-width: 900px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .board { height: 60vh; }
  aside { border-left: 0; border-top: 1px solid var(--rule); }
  .list { max-height: 70vh; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .row { transition: background .12s, color .12s; } }
</style>

<div class="app">
  <header>
    <h1>Kiểm tra bóc tách</h1>
    <span class="file" id="file"></span>
    <label class="field" id="planField" hidden>Mặt bằng <select id="plan"></select></label>
    <label class="field">Chiều cao tầng (m) <input id="height" type="number" step="0.05" min="1" max="10"></label>
    <span class="status edit" id="status">Đang kiểm tra</span>
    <span class="grow"></span>
    <label class="btn" id="openBtn" hidden>Mở bản vẽ… <input id="upload" type="file" accept=".dxf,.dwg" hidden></label>
    <button class="btn" id="undo" type="button" disabled>Hoàn tác</button>
    <button class="btn" id="saveGT" type="button" title="Lưu mặt bằng đã sửa đúng làm đáp án để đo độ chính xác nhận diện">Lưu làm đáp án</button>
    <button class="btn primary" id="confirm" type="button">Xác nhận bản vẽ</button>
  </header>
  <div class="main" id="main">
    <div class="board" id="board" data-mode="select">
      <svg id="svg" role="img" aria-label="Mặt bằng và các tường nhận dạng"></svg>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Chế độ">
          <button type="button" data-mode="select" aria-pressed="true">Chọn</button>
          <button type="button" data-mode="wall" aria-pressed="false">Vẽ thêm tường</button>
          <button type="button" data-mode="open" aria-pressed="false">Thêm cửa</button>
        </div>
        <label class="field" id="newClsField" hidden>Loại <select id="newCls"></select></label>
        <label class="field" id="newKindField" hidden><select id="newKind"><option value="door">Cửa đi</option><option value="window">Cửa sổ</option></select>
          <input id="newW" type="number" step="50" min="200" value="900" aria-label="Rộng (mm)"> × <input id="newH" type="number" step="50" min="200" value="2200" aria-label="Cao (mm)"> mm</label>
        <span class="chipset">
          <label>Nền <select id="bgMode" aria-label="Nền bản vẽ"><option value="cad">Bản vẽ gốc · nền đen</option><option value="cad-light">Bản vẽ gốc · nền trắng</option><option value="lines">Nét đã đọc</option></select></label>
          <label><input type="checkbox" id="showRec" checked> Nhận dạng</label>
          <label><input type="checkbox" id="showLabels"> Nhãn</label>
        </span>
        <button class="btn" type="button" id="fit">Vừa khung</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="scale" id="scale"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="walls">Tường<span class="n" id="nWalls"></span></button>
        <button class="tab" role="tab" data-tab="open">Lỗ mở<span class="n" id="nOpen"></span></button>
        <button class="tab" role="tab" data-tab="qty">Khối lượng</button>
        <button class="tab" role="tab" data-tab="warn">Cảnh báo<span class="n" id="nWarn"></span></button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
      <div class="foot">
        <span class="total">Diện tích tường thực <b id="total">0</b> m²</span>
        <span class="grow"></span>
        <button class="btn" type="button" id="csv">Xuất CSV</button>
        <button class="btn" type="button" id="json">Xuất JSON</button>
      </div>
    </aside>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
const EMBED = /*__DATA__*/null;          // trang tự chứa (script view_takeoff.py) có dữ liệu nhúng; trang chạy trong API thì null
const API = EMBED ? null : "";           // cùng máy chủ với trang
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 2) => Number(v).toLocaleString("vi-VN", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CLASSES = ["110", "150", "220", "330"];
const clsColor = (c) => `var(--c${CLASSES.includes(c) ? c : "110"})`;
const ROLE = { envelope: "bao che", partition: "ngăn" };
// lý do loại một tường nhận nhầm: dùng để thống kê lỗi nhận diện khi lưu làm đáp án
const REASONS = ["chưa ghi lý do", "cầu thang", "lan can", "khung cửa, kính", "nội thất, thiết bị", "bồn hoa, bậc", "cột, vách bê tông", "trùng tường khác", "ký hiệu, chi tiết", "khác"];
const KIND = { door: "Cửa đi", window: "Cửa sổ", block: "Block cửa" };

let DATA = null, PI = 0, P = null, S = null;      // dữ liệu tải về, chỉ số mặt bằng, dữ liệu mặt bằng, trạng thái sửa
const STATES = {};                                // trạng thái sửa theo từng mặt bằng (giữ khi đổi mặt bằng)
let history = [], tab = "walls", filter = "all", selected = null, mode = "select", confirmed = {};

// ---------------------------------------------------------------- trạng thái
function initState(p) {
  return {
    height_mm: p.height_mm,
    walls: p.walls.map((w) => ({ id: w.id, cls: w.cls, role: w.role || "partition", x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2,
      reason: null, mat: w.mat || null, fam: w.fam || null, cand: w.cand || [], masonry: w.masonry, conf: w.conf, layer: w.layer, msrc: w.src, rule: w.rule,
      keep: true, src: "auto", edited: false })),
    openings: p.openings.filter((o) => o.wall).map((o, i) => ({ id: "O" + (i + 1), wall: o.wall, kind: o.kind || "block",
      w: o.w, h: o.h, ev: o.ev, x: o.x, y: o.y, keep: true, src: "auto" })),
    seq: 0,
  };
}
function snapshot() { history.push(JSON.stringify(S)); if (history.length > 100) history.shift(); $("undo").disabled = false; markDirty(); }
function undo() { if (!history.length) return; S = JSON.parse(history.pop()); STATES[PI] = S; $("undo").disabled = !history.length; markDirty(); renderAll(); }
function markDirty() { delete confirmed[PI]; updateStatus(); }
const wallLen = (w) => Math.hypot(w.x2 - w.x1, w.y2 - w.y1) / 1000;

function compute() {
  const H = S.height_mm;
  const kept = S.walls.filter((w) => w.keep && w.masonry), ids = new Set(kept.map((w) => w.id));
  const openArea = {};
  for (const o of S.openings) if (o.keep && ids.has(o.wall)) openArea[o.wall] = (openArea[o.wall] || 0) + o.w * Math.min(o.h, H) / 1e6;
  const groups = {};
  for (const w of kept) {
    const k = w.cls + "|" + w.role, g = (groups[k] = groups[k] || { cls: w.cls, role: w.role, L: 0, open: 0, mats: {} });
    g.L += wallLen(w); g.open += openArea[w.id] || 0;
    if (w.mat) g.mats[w.mat] = (g.mats[w.mat] || 0) + wallLen(w);
  }
  const list = Object.values(groups).sort((a, b) => (a.cls + a.role).localeCompare(b.cls + b.role)).map((g) => {
    const gross = g.L * H / 1000, mat = Object.keys(g.mats).sort((a, b) => g.mats[b] - g.mats[a])[0] || null;
    return { ...g, gross, net: Math.max(0, gross - g.open), mat, share: mat ? g.mats[mat] / g.L : 0 };
  });
  return { groups: list, openArea, total: list.reduce((s, g) => s + g.net, 0) };
}

// ---------------------------------------------------------------- vẽ
const svg = $("svg");
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
let G = {}, unit = 100, snapGrid = null;
function buildStatic() {
  svg.innerHTML = "";
  G = {};
  ["cad", "hatch", "raw", "rej", "walls", "open", "labels", "draft"].forEach((k) => (G[k] = el("g", { "data-layer": k }, svg)));
  G.cad.setAttribute("class", "cadlayer");
  if (P.cad) G.cad.innerHTML = P.cad;          // bản vẽ gốc vẽ đúng như phần mềm CAD (máy chủ dựng bằng ezdxf)
  // cặp nét giống tường nhưng đã loại (bậc thang, lan can, khung cửa sổ): nét đứt xám, rê chuột xem lý do
  for (const r of P.rejected || []) {
    const ln = el("line", { x1: r.x1, y1: r.y1, x2: r.x2, y2: r.y2, stroke: "#9aa7a2", "stroke-width": 2, "stroke-dasharray": "4 4",
      "vector-effect": "non-scaling-stroke", opacity: 0.8 }, G.rej);
    ln.addEventListener("pointerenter", (e) => showTip(e, `Không tính là tường: <b>${esc(r.reason)}</b>`));
    ln.addEventListener("pointermove", moveTip); ln.addEventListener("pointerleave", hideTip);
  }
  const [W, H] = P.size;
  unit = Math.max(W, H) / 100;
  const wallLayers = new Set(P.wall_layers || []);
  const paths = { wall: [], other: [], hatch: [] };
  snapGrid = new Map();
  const addSnap = (x, y) => { const k = Math.floor(x / 500) + ":" + Math.floor(y / 500); (snapGrid.get(k) || snapGrid.set(k, []).get(k)).push([x, y]); };
  for (const [x1, y1, x2, y2, li, isH] of P.segs) {
    const d = `M${x1} ${y1}L${x2} ${y2}`;
    if (isH) { paths.hatch.push(d); continue; }
    (wallLayers.has(P.layers[li].name) ? paths.wall : paths.other).push(d);
    addSnap(x1, y1); addSnap(x2, y2);
  }
  el("path", { d: paths.hatch.join(""), fill: "none", stroke: "var(--line)", "stroke-width": 0.4, opacity: 0.3, "vector-effect": "non-scaling-stroke" }, G.hatch);
  el("path", { d: paths.other.join(""), fill: "none", stroke: "var(--line)", "stroke-width": 0.7, opacity: 0.75, "vector-effect": "non-scaling-stroke" }, G.raw);
  el("path", { d: paths.wall.join(""), fill: "none", stroke: "var(--wall-line)", "stroke-width": 1.1, "vector-effect": "non-scaling-stroke" }, G.raw);
  applyToggles();
}
function band(w) {

    const d = Math.hypot(p[0] - x, p[1] - y);

  }
  for (const w of S.walls) for (const p of [[w.x1, w.y1], [w.x2, w.y2]]) { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = p; } }

}

    const t = Math.max(0, Math.min(1, ((x - w.x1) * (w.x2 - w.x1) + (y - w.y1) * (w.y2 - w.y1)) / L2));
    const d = Math.hypot(x - (w.x1 + t * (w.x2 - w.x1)), y - (w.y1 + t * (w.y2 - w.y1)));

  if (mode === "wall") {
    const q = snap(p);
    if (!draft) { draft = q; return; }
    if (Math.hypot(q[0] - draft[0], q[1] - draft[1]) < 200) return;
    snapshot();
    S.seq += 1;
    const w = { id: "M" + S.seq, cls: $("newCls").value, role: "partition", x1: draft[0], y1: draft[1], x2: q[0], y2: q[1],

function remember(body) {
  try {
    const list = JSON.parse(localStorage.getItem("optimat-confirmed") || "[]").filter((p) => !(p.file === body.file && p.plan === body.plan));
    list.push({ file: body.file, plan: body.plan, height_mm: body.height_mm, groups: body.groups, total_net_area_m2: body.total_net_area_m2,
      confirmed_at: body.confirmed_at, takeoff_id: body.takeoff_id || null });

async function runOptimize(groups) {
  const out = $("optOut"), btn = $("doOptimize");
  btn.disabled = true; btn.textContent = "Đang tối ưu…";

    const r = await fetch(API + "/api/optimize", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ groups, constraints: { keep_design_material: $("keepDesign").checked } }) });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || "Không tối ưu được.");
    const sols = body.solutions || [];
    const pick = sols.length ? [["Chi phí thấp nhất", sols[0]],
      ["Cung ứng nhanh nhất", [...sols].sort((a, b) => a.supply_days - b.supply_days || a.total_cost - b.total_cost)[0]],
      ["Cách nhiệt tốt nhất", [...sols].sort((a, b) => a.u_value - b.u_value || a.total_cost - b.total_cost)[0]]] : [];
    out.innerHTML = (sols.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Phương án</th><th>Tường</th><th>Vật liệu</th><th>Nhà cung cấp</th><th class="num">Tổng đồng</th><th class="num">Ngày</th><th class="num">U</th></tr></thead><tbody>${

    }</tbody></table></div>` : "<p>Không có phương án nào.</p>") + ((body.notes || []).length ? `<ul class="warn">${body.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : "");

function groundTruth() {
  const [ox, oy] = P.origin || [0, 0], ab = (x, y) => [Math.round((x + ox) * 10) / 10, Math.round((oy - y) * 10) / 10];
  const wall = (w) => { const [x1, y1] = ab(w.x1, w.y1), [x2, y2] = ab(w.x2, w.y2); return { id: w.id, cls: w.cls, role: w.role, x1, y1, x2, y2, src: w.src, edited: !!w.edited }; };
  return { version: 1, file: DATA.file, plan: P.plan.name, height_mm: S.height_mm, saved_at: new Date().toISOString(),
    walls: S.walls.filter((w) => w.keep && w.masonry).map(wall),
    removed: S.walls.filter((w) => !w.keep && w.src !== "manual").map((w) => ({ ...wall(w), reason: w.reason || REASONS[0] })),
    openings: S.openings.filter((o) => o.keep).map((o) => ({ id: o.id, wall: o.wall, kind: o.kind, w: o.w, h: o.h, src: o.src })) };
}

const tip = $("tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) {
  const r = $("board").getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x -= tip.offsetWidth + 28;
  if (y + tip.offsetHeight > r.height - 8) y -= tip.offsetHeight + 28;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }
let vb = { x: 0, y: 0, w: 1, h: 1 };
function setVB(v) { vb = v; svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); const r = svg.getBoundingClientRect(); const mm = v.w / (r.width || 1) * 100; const nice = [100, 200, 500, 1000, 2000, 5000, 10000, 20000].find((n) => n >= mm) || 50000; $("scale").textContent = `${Math.round(100 * nice / mm)} px = ${nice >= 1000 ? nice / 1000 + " m" : nice + " mm"}`; }
function fitBox(x0, y0, x1, y1, padRatio = 0.08) {
  const r = svg.getBoundingClientRect(), ar = (r.width || 1) / (r.height || 1);
  const pad = Math.max(x1 - x0, y1 - y0) * padRatio + 500;
  let w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad;
  if (w / h < ar) w = h * ar; else h = w / ar;
  setVB({ x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h });
}
function fit() { const sz = PI < 0 ? DATA.overview.size : P.size; fitBox(0, 0, sz[0], sz[1], 0.03); }
function focusOn(w) { fitBox(Math.min(w.x1, w.x2), Math.min(w.y1, w.y2), Math.max(w.x1, w.x2), Math.max(w.y1, w.y2), 0.6); }
function zoom(f, cx, cy) {
  const r = svg.getBoundingClientRect(), px = (cx - r.left) / r.width, py = (cy - r.top) / r.height;
  setVB({ x: vb.x + vb.w * (1 - f) * px, y: vb.y + vb.h * (1 - f) * py, w: vb.w * f, h: vb.h * f });
}
svg.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
let drag = null, moved = false;
svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb } }; moved = false; });
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) moved = true;
  if (!moved) return;
  const r = svg.getBoundingClientRect();
  setVB({ ...drag.vb, x: drag.vb.x - (e.clientX - drag.x) * vb.w / r.width, y: drag.vb.y - (e.clientY - drag.y) * vb.h / r.height });
});
window.addEventListener("pointerup", () => { drag = null; setTimeout(() => (moved = false), 0); });
$("fit").addEventListener("click", fit);
window.addEventListener("resize", () => setVB(vb));

function loadPlan(i) {
  PI = i; P = DATA.plans[i];
  S = STATES[i] = STATES[i] || initState(P);
  history = []; $("undo").disabled = true; selected = null; draft = null;
  buildStatic(); fit(); renderAll(); setMode(mode);
}
function start(data) {
  DATA = data;
  DATA.materials = DATA.materials || [];
  DATA.families = DATA.families || [];
  $("file").textContent = DATA.file || "";
  $("newCls").innerHTML = CLASSES.map((c) => `<option ${c === "220" ? "selected" : ""}>${c}</option>`).join("");
  const hasOverview = !!(DATA.overview && DATA.overview.cad);
  $("planField").hidden = !(DATA.plans.length > 1 || hasOverview);
  $("plan").innerHTML = (hasOverview ? `<option value="-1">Toàn bộ bản vẽ</option>` : "") +
    DATA.plans.map((p, i) => `<option value="${i}">${i + 1}. ${esc(p.plan.name)}</option>`).join("");
  $("plan").onchange = (e) => { const v = Number(e.target.value); v < 0 ? showOverview() : loadPlan(v); };
  for (const k in STATES) delete STATES[k];
  confirmed = {};
  if (hasOverview) { showOverview(); if (!DATA.plans.length) $("list").insertAdjacentHTML("afterbegin", `<div class="empty">Không tìm thấy mặt bằng kiến trúc để đo tường (bản vẽ chỉ có mặt bằng kết cấu, móng hoặc điện nước).</div>`); return; }
  if (!DATA.plans.length) {
    $("svg").innerHTML = ""; $("list").innerHTML = `<div class="empty">Bản vẽ không có mặt bằng kiến trúc để đo tường (chỉ có mặt bằng kết cấu, móng hoặc điện nước).</div>`;
    return;
  }
  loadPlan(0);
}
if (EMBED) start(EMBED);
else {
  $("openBtn").hidden = false;
  $("svg").innerHTML = "";
  $("list").innerHTML = `<div class="empty">Chọn "Mở bản vẽ…" để tải file .dxf hoặc .dwg. Hệ thống tách từng mặt bằng tầng, nhận dạng tường và lỗ mở; bạn kiểm tra, sửa, bổ sung rồi xác nhận.</div>`;
  $("upload").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    $("list").innerHTML = `<div class="empty">Đang đọc ${esc(f.name)}…</div>`;
    const form = new FormData(); form.append("file", f);
    try {
      const r = await fetch("/api/takeoff/view", { method: "POST", body: form });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || "Không đọc được bản vẽ.");
      start(body);
    } catch (err) { $("list").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
  });
}
setMode("select");
</script>
